[package]
name = "recipe-backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "recipe_backend"
path = "src/lib.rs"

[[bin]]
name = "recipe-backend"
path = "src/main.rs"

[dependencies]
axum = "0.8"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
